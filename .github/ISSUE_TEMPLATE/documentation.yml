name: Documentation or navigation
description: Report unclear instructions, missing context or a broken link.
title: "[Docs] "
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      description: Link the page, or give its path and section heading.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs to be clearer?
      description: Explain what you were trying to find or do and where the documentation fell short.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Share a proposed correction or a clearer route through the documentation, if you have one.
